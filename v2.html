    <style>
        * {
            box-sizing: border-box;
            margin: 0;

        body {
            background: linear-gradient(180deg, #070a12 0%, #0b0f19 50%, #111625 100%);
            color: #f8fafc;
            min-height: 100vh;

        .bg-watermark {
            position: fixed;

            font-weight: 900;
            color: rgba(226, 172, 178, 0.02);
            white-space: nowrap;
            pointer-events: none;
            z-index: 0;
            letter-spacing: 12px;
            text-transform: uppercase;
        }

        .floating-heart {
            position: fixed;
            top: -30px;
            font-size: 20px;
            animation: fall linear infinite;
            z-index: 1;
            pointer-events: none;
            opacity: 0.35;
        }

        @keyframes fall {
            to {
                transform: translateY(110vh) rotate(360deg);
            }
        }

            padding: 30px 10px 10px 10px;
        }

        .main-header .subtitle {

            font-weight: 800;
            letter-spacing: 1.5px;
            margin-bottom: 12px;
            display: block;
