<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أثر النور - مياسم</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@200;300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #010104;
            --text-main: #f0edf6;
            --accent: #c93b5d;
            --gold: #e5b853;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            font-family: 'Tajawal', sans-serif;
            color: var(--text-main);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            transition: background-color 2s ease;
        }

        /* خلفية الإضاءة عند الضغط */
        body.revealed {
            background-color: #06050b;
        }

        .ambient-glow {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, rgba(229, 184, 83, 0) 0%, transparent 70%);
            transition: 2.2s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
        }

        body.revealed .ambient-glow {
            background: radial-gradient(circle at center, rgba(229, 184, 83, 0.08) 0%, transparent 75%);
        }

        .workspace {
            position: relative;
            width: 100%;
            max-width: 440px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2;
            padding: 24px;
        }

        /* نقطة النبض المركزية في العتمة */
        .core-trigger {
            position: relative;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: 1.2s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 5;
        }

        .core-dot {
            width: 14px;
            height: 14px;
            background: var(--accent);
            border-radius: 50%;
            box-shadow: 0 0 20px var(--accent);
            animation: pulse-dot 2.5s infinite ease-in-out;
            transition: 0.8s ease;
        }

        @keyframes pulse-dot {
            0%, 100% { transform: scale(1); opacity: 0.6; box-shadow: 0 0 15px var(--accent); }
            50% { transform: scale(1.35); opacity: 1; box-shadow: 0 0 30px var(--accent); }
        }

        .core-trigger:hover .core-dot {
            background: var(--gold);
            box-shadow: 0 0 25px var(--gold);
        }

        .trigger-hint {
            position: absolute;
            bottom: -35px;
            font-size: 12px;
            color: rgba(240, 237, 246, 0.3);
            letter-spacing: 2px;
            font-weight: 300;
            white-space: nowrap;
            transition: opacity 0.6s ease;
        }

        body.revealed .core-trigger {
            opacity: 0;
            pointer-events: none;
            transform: scale(0.5);
        }

        /* عناصر الورود والأثر الناعم تظهر تدريجياً */
        .roses-container {
            position: absolute;
            inset: 0;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 3;
            opacity: 0;
            transition: 2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        body.revealed .roses-container {
            opacity: 1;
        }

        .ambient-rose {
            position: absolute;
            font-size: 22px;
            color: rgba(201, 59, 93, 0.25);
            filter: blur(1px);
            transition: 2s ease;
        }

        body.revealed .ambient-rose {
            color: rgba(229, 184, 83, 0.35);
            filter: blur(0px);
        }

        /* مواقع الورود الموزعة بهدوء وبدون زحمة */
        .ar-1 { top: 22%; right: 18%; transform: rotate(-15deg); }
        .ar-2 { top: 25%; left: 18%; transform: rotate(15deg); }
        .ar-3 { bottom: 32%; right: 12%; transform: rotate(8deg); }
        .ar-4 { bottom: 30%; left: 12%; transform: rotate(-10deg); }

        /* نافذة الإهداء والرسالة العميقة */
        .dedication-card {
            position: absolute;
            bottom: 6vh;
            width: 90%;
            max-width: 400px;
            background: rgba(5, 4, 10, 0.96);
            border: 1px solid rgba(229, 184, 83, 0.35);
            backdrop-filter: blur(25px);
            padding: 32px 26px;
            border-radius: 12px;
            text-align: right;
            line-height: 2.7;
            font-size: 15px;
            font-weight: 300;
            color: #eae6f4;
            box-shadow: 0 25px 70px rgba(0,0,0,0.95);
            opacity: 0;
            transform: translateY(35px) scale(0.96);
            pointer-events: none;
            transition: 1.6s cubic-bezier(0.16, 1, 0.3, 1) 0.3s;
            z-index: 10;
        }

        body.revealed .dedication-card {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
        }

        .dedication-card strong {
            color: var(--gold);
            font-weight: 400;
        }

        .dedication-signature {
            margin-top: 20px;
            font-size: 13px;
            color: var(--gold);
            letter-spacing: 2px;
            text-align: left;
            font-weight: 300;
        }
    </style>
</head>
<body>

    <div class="ambient-glow"></div>

    <div class="workspace">
        
        <!-- زر النبض المركزي في العتمة -->
        <div class="core-trigger" onclick="revealSanctuary()">
            <div class="core-dot"></div>
            <div class="trigger-hint">لامس النور</div>
        </div>

        <!-- حديقة الورود والأثر الهادئ -->
        <div class="roses-container">
            <span class="ambient-rose ar-1">✦</span>
            <span class="ambient-rose ar-2">✦</span>
            <span class="ambient-rose ar-3">✦</span>
            <span class="ambient-rose ar-4">✦</span>
        </div>

        <!-- بطاقة الإهداء والرسالة العميقة -->
        <div class="dedication-card">
            حين كانت الأيام غارقة في العتمة والشتات، جئتِ أنتِ كأنكِ الفجر الذي أضاء كل ملامح المكان. بلمسة واحدة من حضورك، تلاشت الوحشة واستقام كل شيء في مقامه الصحيح.. <strong>أنتِ أصلحتِ قلبي</strong> وأعدتِ له النبض والصفاء التام.
            <div class="dedication-signature">إلى مياسم (سوسو)</div>
        </div>

    </div>

    <script>
        function revealSanctuary() {
            document.body.classList.add('revealed');
        }
    </script>
</body>
</html>
