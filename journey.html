<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>التئام الأثر - مياسم</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@200;300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #020205;
            --text-main: #f0edf6;
            --accent: #c93b5d;
            --gold: #e5b853;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            font-family: 'Tajawal', sans-serif;
            color: var(--text-main);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* خلفية ناعمة هادئة */
        .ambient-glow {
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(201, 59, 93, 0.06) 0%, transparent 70%);
            border-radius: 50%;
            z-index: 0;
            transition: 1.8s ease;
        }

        body.completed .ambient-glow {
            background: radial-gradient(circle, rgba(229, 184, 83, 0.12) 0%, transparent 75%);
            transform: scale(1.3);
        }

        .workspace {
            position: relative;
            width: 100%;
            max-width: 440px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2;
            padding: 24px;
        }

        /* مسرح القلب المعكوس الكبير والدقيق */
        .sanctuary {
            position: relative;
            width: 320px;
            height: 320px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .heart-frame {
            position: absolute;
            width: 280px;
            height: 280px;
            transform: scaleX(-1) rotate(180deg);
            z-index: 1;
            pointer-events: none;
        }

        .heart-frame svg {
            width: 100%;
            height: 100%;
            fill: none;
            stroke: rgba(201, 59, 93, 0.2);
            stroke-width: 1;
            transition: 1.5s ease;
        }

        body.completed .heart-frame svg {
            stroke: var(--gold);
            stroke-width: 1.5;
            fill: rgba(229, 184, 83, 0.04);
            filter: drop-shadow(0 0 30px rgba(229, 184, 83, 0.25));
        }

        /* الشظايا أو الأجزاء المبعثرة التي سيتم ترتيبها بدقة */
        .fragments-container {
            position: absolute;
            inset: 40px;
            z-index: 3;
        }

        .fragment {
            position: absolute;
            width: 44px;
            height: 44px;
            background: #120e1a;
            border: 1px solid rgba(201, 59, 93, 0.35);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .fragment::after {
            content: '';
            width: 10px;
            height: 10px;
            background: var(--accent);
            border-radius: 50%;
            transition: 0.5s ease;
        }

        .fragment:hover {
            border-color: var(--accent);
            transform: scale(1.1);
        }

        /* مواقع الشظايا وهي مبعثرة في البداية */
        #frag-1 { top: 20px; left: 40px; }
        #frag-2 { top: 10px; right: 40px; }
        #frag-3 { top: 110px; left: 10px; }
        #frag-4 { top: 110px; right: 10px; }
        #frag-5 { bottom: 20px; left: 110px; }

        /* عندما تصطف الشظايا في مكانها الصحيح وتلتئم */
        .fragment.aligned {
            background: rgba(229, 184, 83, 0.15);
            border-color: var(--gold);
            box-shadow: 0 0 20px rgba(229, 184, 83, 0.3);
            pointer-events: none;
        }

        .fragment.aligned::after {
            background: var(--gold);
            box-shadow: 0 0 10px var(--gold);
        }

        /* انتقال القطع لأماكنها المركزية المتناسقة عند الاكتمال */
        body.completed #frag-1 { top: 60px; left: 90px; }
        body.completed #frag-2 { top: 60px; right: 90px; }
        body.completed #frag-3 { top: 120px; left: 60px; }
        body.completed #frag-4 { top: 120px; right: 60px; }
        body.completed #frag-5 { bottom: 50px; left: 118px; }

        /* التوجيه الهادئ */
        .instruction-hint {
            position: absolute;
            top: 14vh;
            font-size: 13px;
            color: rgba(240, 237, 246, 0.35);
            letter-spacing: 2px;
            font-weight: 300;
            transition: opacity 0.5s ease;
        }

        body.completed .instruction-hint {
            opacity: 0;
        }

        /* الرسالة العميقة والمدروسة بدقة */
        .profound-message {
            position: absolute;
            bottom: 5vh;
            width: 90%;
            max-width: 390px;
            background: rgba(5, 4, 10, 0.97);
            border: 1px solid rgba(229, 184, 83, 0.35);
            backdrop-filter: blur(20px);
            padding: 30px 24px;
            border-radius: 12px;
            text-align: right;
            line-height: 2.6;
            font-size: 15px;
            font-weight: 300;
            color: #eae6f4;
            box-shadow: 0 20px 60px rgba(0,0,0,0.9);
            opacity: 0;
            transform: translateY(30px) scale(0.97);
            pointer-events: none;
            transition: 1.4s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 10;
        }

        body.completed .profound-message {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
        }

        .profound-message strong {
            color: var(--gold);
            font-weight: 400;
        }

        .signature {
            margin-top: 18px;
            font-size: 13px;
            color: var(--accent);
            letter-spacing: 2px;
            text-align: left;
            font-weight: 300;
        }
        body.completed .signature {
            color: var(--gold);
        }
    </style>
</head>
<body>

    <div class="ambient-glow"></div>

    <div class="workspace">
        
        <div class="instruction-hint">اضغط على أجزاء الشتات لتلتئم في مكانها الصحيح</div>

        <div class="sanctuary">
            
            <div class="heart-frame">
                <svg viewBox="0 0 24 24">
                    <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                </svg>
            </div>

            <!-- أجزاء الشتات التفاعلية -->
            <div class="fragments-container">
                <div class="fragment" id="frag-1" onclick="alignFragment(1)"></div>
                <div class="fragment" id="frag-2" onclick="alignFragment(2)"></div>
                <div class="fragment" id="frag-3" onclick="alignFragment(3)"></div>
                <div class="fragment" id="frag-4" onclick="alignFragment(4)"></div>
                <div class="fragment" id="frag-5" onclick="alignFragment(5)"></div>
            </div>

        </div>

        <div class="profound-message">
            حين كانت كل تفاصيل الروح مبعثرة وتأخذ ألواناً مختلفة من الشتات والغياب، جئتِ أنتِ بهدوء حضورك الحقيقي لتعيدي ترتيب كل زاوية وتضعيها في نصابها الصحيح. بلمستك الواعية، <strong>أنتِ أصلحتِ قلبي</strong> وأعدتِ له النبض والتناغم والصفاء التام.
            <div class="signature">إلى مياسم (سوسو)</div>
        </div>

    </div>

    <script>
        let alignedCount = 0;
        const totalFragments = 5;
        const states = { 1: false, 2: false, 3: false, 4: false, 5: false };

        function alignFragment(id) {
            if (states[id]) return;

            states[id] = true;
            document.getElementById(`frag-${id}`).classList.add('aligned');
            alignedCount++;

            if (alignedCount === totalFragments) {
                setTimeout(() => {
                    document.body.classList.add('completed');
                }, 400);
            }
        }
    </script>
</body>
</html>
