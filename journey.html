<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أثر الوصال - مياسم</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@200;300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #020205;
            --text-main: #f0edf6;
            --text-muted: #5a556d;
            --accent: #e05675;
            --gold: #dfb34a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            font-family: 'Tajawal', sans-serif;
            color: var(--text-main);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* الخلفية الهادئة جداً للوحات والأسماء المخفية في العمق */
        .ambient-watermarks {
            position: absolute;
            inset: 0;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 0;
            overflow: hidden;
        }

        .watermark-text {
            position: absolute;
            font-weight: 200;
            color: rgba(255, 255, 255, 0.02);
            filter: blur(14px);
            letter-spacing: 5px;
        }

        .wm-1 { top: 12%; right: 10%; font-size: 6.5rem; transform: rotate(-8deg); }
        .wm-2 { bottom: 10%; left: 8%; font-size: 7.5rem; transform: rotate(12deg); }
        .wm-3 { top: 48%; left: 15%; font-size: 5rem; transform: rotate(-4deg); }

        /* حاوية العمل الرئيسية */
        .workspace {
            position: relative;
            width: 100%;
            max-width: 420px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2;
            padding: 20px;
        }

        /* مسرح اللوحة والهيكل الحقيقي للقلب */
        .sanctuary-board {
            position: relative;
            width: 300px;
            height: 300px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* هيكل القلب الأساسي المصمم برسم حقيقي هندسي وناعم */
        .structural-heart {
            position: relative;
            width: 160px;
            height: 160px;
        }

        .structural-heart svg {
            width: 100%;
            height: 100%;
            fill: rgba(224, 86, 117, 0.03);
            stroke: rgba(224, 86, 117, 0.2);
            stroke-width: 1;
            transition: 1.2s ease;
        }

        /* مسارات ومواضع الاستقرار الدقيقة داخل القلب */
        .integration-slot {
            position: absolute;
            border: 1px solid rgba(224, 86, 117, 0.15);
            border-radius: 4px;
            background: rgba(224, 86, 117, 0.02);
            cursor: pointer;
            transition: 0.5s ease;
        }

        .integration-slot:hover {
            border-color: var(--accent);
            background: rgba(224, 86, 117, 0.08);
        }

        #slot-1 { top: 35px; left: 50px; width: 40px; height: 35px; }
        #slot-2 { top: 70px; left: 30px; width: 45px; height: 45px; }
        #slot-3 { top: 70px; right: 30px; width: 45px; height: 45px; }

        /* الشظايا أو الأجزاء المبعثرة في الأطراف للاستكشاف الهادئ */
        .fragment-element {
            position: absolute;
            width: 44px;
            height: 44px;
            background: rgba(12, 11, 18, 0.95);
            border: 1px solid rgba(224, 86, 117, 0.4);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
            transition: transform 0.4s ease, border-color 0.4s ease, opacity 0.6s ease;
            z-index: 5;
        }

        .fragment-element svg {
            width: 20px;
            height: 20px;
            fill: var(--accent);
        }

        .fragment-element:hover {
            transform: scale(1.12);
            border-color: var(--accent);
            box-shadow: 0 0 25px rgba(224, 86, 117, 0.3);
        }

        /* مواقع انتشار الأجزاء في الفضاء المحيط */
        #frag-1 { top: 18vh; left: 45px; }
        #frag-2 { bottom: 22vh; left: 50px; }
        #frag-3 { bottom: 20vh; right: 50px; }

        .fragment-element.integrated {
            opacity: 0;
            pointer-events: none;
            transform: scale(0);
        }

        /* العناصر المستقرة داخل القلب */
        .anchored-piece {
            position: absolute;
            background: var(--accent);
            border-radius: 3px;
            opacity: 0;
            transform: scale(0.4);
            transition: 0.7s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
        }

        .integration-slot.occupied .anchored-piece {
            opacity: 1;
            transform: scale(1);
            inset: 2px;
            box-shadow: 0 0 15px rgba(224, 86, 117, 0.4);
        }

        .integration-slot.occupied {
            border-color: var(--accent);
            background: rgba(224, 86, 117, 0.1);
        }

        /* عند اكتمال الاستقرار والانسجام التام */
        .sanctuary-board.completed .structural-heart svg {
            fill: rgba(223, 179, 74, 0.08);
            stroke: var(--gold);
            stroke-width: 1.5;
            filter: drop-shadow(0 0 35px rgba(223, 179, 74, 0.25));
        }

        .sanctuary-board.completed .integration-slot {
            border-color: transparent;
            background: transparent;
        }

        .sanctuary-board.completed .anchored-piece {
            background: var(--gold);
            box-shadow: 0 0 20px var(--gold);
        }

        /* الرسالة النهائية العميقة والمؤثرة */
        .profound-message-box {
            position: absolute;
            bottom: 8vh;
            width: 90%;
            max-width: 380px;
            background: rgba(8, 7, 12, 0.94);
            border: 1px solid rgba(223, 179, 74, 0.25);
            backdrop-filter: blur(20px);
            padding: 32px 26px;
            border-radius: 14px;
            text-align: right;
            line-height: 2.5;
            font-size: 15px;
            font-weight: 300;
            color: #eae6f2;
            box-shadow: 0 20px 60px rgba(0,0,0,0.9);
            opacity: 0;
            transform: translateY(35px) scale(0.96);
            pointer-events: none;
            transition: 1.6s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 10;
        }

        .profound-message-box.reveal {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
        }

        .profound-message-box strong {
            color: var(--gold);
            font-weight: 400;
        }

        .message-attribution {
            margin-top: 20px;
            font-size: 13px;
            color: var(--accent);
            letter-spacing: 2px;
            text-align: left;
            font-weight: 300;
        }
    </style>
</head>
<body>

    <!-- الخلفية الهادئة والعميقة -->
    <div class="ambient-watermarks">
        <span class="watermark-text wm-1">سوسو</span>
        <span class="watermark-text wm-2">مياسم</span>
        <span class="watermark-text wm-3">قلب بابا</span>
    </div>

    <div class="workspace">
        
        <!-- اللوحة الهادئة للاستكشاف والانسجام الصامت -->
        <div class="sanctuary-board" id="sanctuaryBoard">
            
            <div class="structural-heart">
                <svg viewBox="0 0 24 24">
                    <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                </svg>

                <div class="integration-slot" id="slot-1" onclick="integratePiece(1)">
                    <div class="anchored-piece"></div>
                </div>
                <div class="integration-slot" id="slot-2" onclick="integratePiece(2)">
                    <div class="anchored-piece"></div>
                </div>
                <div class="integration-slot" id="slot-3" onclick="integratePiece(3)">
                    <div class="anchored-piece"></div>
                </div>
            </div>

            <!-- أجزاء الاستكشاف في الأطراف -->
            <div class="fragment-element" id="frag-1" onclick="selectFragment(1)">
                <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
            </div>
            <div class="fragment-element" id="frag-2" onclick="selectFragment(2)">
                <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
            </div>
            <div class="fragment-element" id="frag-3" onclick="selectFragment(3)">
                <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
            </div>

        </div>

        <!-- الرسالة العميقـة والمؤثرة -->
        <div class="profound-message-box" id="profoundMessage">
            لم يكن مجرد حضور عابر في تفاصيل أيّام مغلقة؛ بل كان تماماً كمن أعاد ترتيب الفوضى الساكنة في زوايا الروح. <strong>دخولكِ إلى حياتي</strong> جاء كترميم ناعم أزال كل أثر للشتات، وأعاد لهذا القلب اتزانه ونبضه الأبديّ بكل هدوء.
            <div class="message-attribution">إلى مياسم (سوسو)</div>
        </div>

    </div>

    <script>
        let activeSelection = null;
        let integratedCount = 0;
        const totalFragments = 3;
        const stateMap = { 1: false, 2: false, 3: false };

        function selectFragment(id) {
            if (stateMap[id]) return;
            
            document.querySelectorAll('.fragment-element').forEach(el => el.style.borderColor = 'rgba(224, 86, 117, 0.4)');
            document.getElementById(`frag-${id}`).style.borderColor = 'var(--gold)';
            activeSelection = id;
        }

        function integratePiece(slotId) {
            if (!activeSelection) return;
            if (stateMap[activeSelection]) return;

            stateMap[activeSelection] = true;
            document.getElementById(`slot-${slotId}`).classList.add('occupied');
            document.getElementById(`frag-${activeSelection}`).classList.add('integrated');

            activeSelection = null;
            integratedCount++;

            if (integratedCount === totalFragments) {
                setTimeout(() => {
                    document.getElementById('sanctuaryBoard').classList.add('completed');
                }, 500);

                setTimeout(() => {
                    document.getElementById('profoundMessage').classList.add('reveal');
                }, 1400);
            }
        }
    </script>
</body>
</html>
