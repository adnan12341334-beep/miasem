<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تآلف المسارات - مياسم</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@200;300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #010104;
            --text-main: #f0edf6;
            --accent: #c93b5d;
            --gold: #e5b853;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            font-family: 'Tajawal', sans-serif;
            color: var(--text-main);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .ambient-watermarks {
            position: absolute;
            inset: 0;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 0;
            overflow: hidden;
        }

        .watermark-text {
            position: absolute;
            font-weight: 200;
            color: rgba(255, 255, 255, 0.015);
            filter: blur(18px);
            letter-spacing: 8px;
        }

        .wm-1 { top: 12%; right: 10%; font-size: 7rem; transform: rotate(-5deg); }
        .wm-2 { bottom: 10%; left: 8%; font-size: 8rem; transform: rotate(8deg); }
        .wm-3 { top: 48%; left: 15%; font-size: 5rem; transform: rotate(-3deg); }

        .workspace {
            position: relative;
            width: 100%;
            max-width: 480px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2;
            padding: 20px;
        }

        /* مسرح القلب الكبير المعكوس */
        .sanctuary-board {
            position: relative;
            width: 340px;
            height: 340px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .structural-heart {
            position: relative;
            width: 280px;
            height: 280px;
            /* قلب معكوس تماماً وبحجم كبير ومنحوت بدقة */
            transform: scaleX(-1) rotate(180deg);
        }

        .structural-heart svg {
            width: 100%;
            height: 100%;
            fill: none;
            stroke: rgba(201, 59, 93, 0.25);
            stroke-width: 1.2;
            transition: 1.6s ease;
        }

        /* شبكة النقاط المتفاعلة لإصلاح المسار */
        .nodes-container {
            position: absolute;
            inset: 50px;
            z-index: 4;
        }

        .node {
            position: absolute;
            width: 32px;
            height: 32px;
            background: #14101c;
            border: 1px solid rgba(201, 59, 93, 0.4);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.5s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }

        .node::after {
            content: '';
            width: 8px;
            height: 8px;
            background: var(--accent);
            border-radius: 50%;
            transition: 0.4s ease;
        }

        .node:hover {
            border-color: var(--accent);
            transform: scale(1.15);
        }

        /* مواقع النقاط المبعثرة داخل القلب */
        #node-1 { top: 40px; left: 60px; }
        #node-2 { top: 30px; right: 60px; }
        #node-3 { top: 100px; left: 30px; }
        #node-4 { top: 100px; right: 30px; }
        #node-5 { bottom: 30px; left: 100px; }

        /* حالة الاتصال والاندمال */
        .node.connected {
            background: rgba(229, 184, 83, 0.15);
            border-color: var(--gold);
            box-shadow: 0 0 20px rgba(229, 184, 83, 0.3);
        }

        .node.connected::after {
            background: var(--gold);
            box-shadow: 0 0 10px var(--gold);
        }

        .sanctuary-board.aligned .structural-heart svg {
            stroke: var(--gold);
            stroke-width: 1.5;
            fill: rgba(229, 184, 83, 0.05);
            filter: drop-shadow(0 0 40px rgba(229, 184, 83, 0.25));
        }

        .instruction-hint {
            position: absolute;
            top: 15vh;
            font-size: 13px;
            color: rgba(240, 237, 246, 0.4);
            letter-spacing: 1.5px;
            font-weight: 300;
            transition: opacity 0.6s ease;
        }

        .sanctuary-board.aligned ~ .instruction-hint {
            opacity: 0;
        }

        /* الرسالة العميقة */
        .profound-message-box {
            position: absolute;
            bottom: 6vh;
            width: 92%;
            max-width: 400px;
            background: rgba(6, 5, 10, 0.97);
            border: 1px solid rgba(229, 184, 83, 0.3);
            backdrop-filter: blur(20px);
            padding: 32px 26px;
            border-radius: 12px;
            text-align: right;
            line-height: 2.7;
            font-size: 15px;
            font-weight: 300;
            color: #eae6f2;
            box-shadow: 0 25px 70px rgba(0,0,0,0.95);
            opacity: 0;
            transform: translateY(35px) scale(0.96);
            pointer-events: none;
            transition: 1.6s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 10;
        }

        .profound-message-box.reveal {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
        }

        .profound-message-box strong {
            color: var(--gold);
            font-weight: 400;
        }

        .message-attribution {
            margin-top: 20px;
            font-size: 13px;
            color: var(--accent);
            letter-spacing: 2px;
            text-align: left;
            font-weight: 300;
        }
    </style>
</head>
<body>

    <div class="ambient-watermarks">
        <span class="watermark-text wm-1">سوسو</span>
        <span class="watermark-text wm-2">مياسم</span>
        <span class="watermark-text wm-3">قلب بابا</span>
    </div>

    <div class="workspace">
        
        <div class="instruction-hint">اضغط على نقاط الشتات لتتصل وتتألف معاً</div>

        <div class="sanctuary-board" id="sanctuaryBoard">
            
            <div class="structural-heart">
                <svg viewBox="0 0 24 24">
                    <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                </svg>
            </div>

            <!-- نقاط المسارات الداخلية -->
            <div class="nodes-container">
                <div class="node" id="node-1" onclick="connectNode(1)"></div>
                <div class="node" id="node-2" onclick="connectNode(2)"></div>
                <div class="node" id="node-3" onclick="connectNode(3)"></div>
                <div class="node" id="node-4" onclick="connectNode(4)"></div>
                <div class="node" id="node-5" onclick="connectNode(5)"></div>
            </div>

        </div>

        <div class="profound-message-box" id="profoundMessage">
            حين كانت مسارات الروح مبعثرة وتائهة بين تفاصيل الغياب، جئتِ أنتِ بهدوئك المطلق لتربطي كل خيط وتضعيه في مكانه الصحيح. بلمسة حضورك، <strong>أنتِ أصلحتِ قلبي</strong> وأعدتِ له التناغم والنبض الحقيقي.
            <div class="message-attribution">إلى مياسم (سوسو)</div>
        </div>

    </div>

    <script>
        let connectedCount = 0;
        const totalNodes = 5;
        const nodeStates = { 1: false, 2: false, 3: false, 4: false, 5: false };

        function connectNode(id) {
            if (nodeStates[id]) return;

            nodeStates[id] = true;
            document.getElementById(`node-${id}`).classList.add('connected');
            connectedCount++;

            if (connectedCount === totalNodes) {
                setTimeout(() => {
                    document.getElementById('sanctuaryBoard').classList.add('aligned');
                }, 500);

                setTimeout(() => {
                    document.getElementById('profoundMessage').classList.add('reveal');
                }, 1400);
            }
        }
    </script>
</body>
</html>
