<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أثر - مياسم</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@200;300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #020205;
            --text-main: #f0edf6;
            --text-muted: #6b6680;
            --accent: #ff6b8b;
            --accent-glow: rgba(255, 107, 139, 0.35);
            --gold: #f4d06f;
            --gold-glow: rgba(244, 208, 111, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            font-family: 'Tajawal', sans-serif;
            color: var(--text-main);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* جزيئات ضوئية خفيفة في الخلفية لزيادة العمق */
        .ambient-dust {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background-image: radial-gradient(circle, rgba(255,255,255,0.06) 1px, transparent 1px);
            background-size: 120px 120px;
            opacity: 0.4;
        }

        /* الخلفية الهادئة جداً للوحات والأسماء بلا تشويش */
        .ambient-watermarks {
            position: absolute;
            inset: 0;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 0;
            overflow: hidden;
        }

        .watermark-text {
            position: absolute;
            font-weight: 200;
            color: rgba(255, 255, 255, 0.025);
            filter: blur(10px);
            transition: 1.5s ease;
        }

        .wm-1 { top: 12%; right: 10%; font-size: 7rem; transform: rotate(-10deg); }
        .wm-2 { bottom: 10%; left: 8%; font-size: 8rem; transform: rotate(15deg); }
        .wm-3 { top: 45%; left: 15%; font-size: 5rem; transform: rotate(-5deg); }

        /* حاوية العمل الرئيسية */
        .workspace {
            position: relative;
            width: 100%;
            max-width: 420px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2;
            padding: 25px;
        }

        /* توجيه نصي علوي رقيق */
        .instruction-banner {
            position: absolute;
            top: 15vh;
            font-size: 13px;
            font-weight: 300;
            color: var(--text-muted);
            letter-spacing: 3px;
            text-align: center;
            transition: 0.8s ease;
            opacity: 0.8;
        }

        /* منطقة الهدف الحاضنة للقلب */
        .heart-puzzle-stage {
            width: 260px;
            height: 260px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* دائرة مسار التجميع الخافتة */
        .target-guide-ring {
            position: absolute;
            inset: 20px;
            border: 1px dashed rgba(255, 107, 139, 0.15);
            border-radius: 50%;
            transition: 1s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .heart-puzzle-stage.completed .target-guide-ring {
            border-color: var(--gold);
            border-style: solid;
            box-shadow: 0 0 60px var(--gold-glow);
            background: rgba(244, 208, 111, 0.02);
            transform: scale(1.05);
        }

        /* قطع القلب المبعثرة (قطع بازل فنية قابلة للنقر والسحب البصري) */
        .puzzle-shard {
            position: absolute;
            cursor: pointer;
            transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.5s ease;
            filter: drop-shadow(0 4px 12px rgba(0,0,0,0.5));
            z-index: 3;
        }

        .puzzle-shard svg {
            width: 70px;
            height: 70px;
            fill: var(--accent);
            transition: fill 0.5s ease, transform 0.3s ease;
        }

        .puzzle-shard:hover svg {
            transform: scale(1.1);
            filter: drop-shadow(0 0 12px var(--accent-glow));
        }

        /* مواقع التباعد للقطع المبعثرة بشكل فني وصعب نسبياً */
        #shard-1 { top: 10px; left: 15px; transform: rotate(-35deg); }
        #shard-2 { top: 15px; right: 15px; transform: rotate(45deg); }
        #shard-3 { bottom: 15px; left: 20px; transform: rotate(20deg); }
        #shard-4 { bottom: 10px; right: 20px; transform: rotate(-25deg); }

        /* عندما يتم تجميع القطعة بنجاح */
        .puzzle-shard.collected {
            top: 50% !important;
            left: 50% !important;
            transform: translate(-50%, -50%) scale(0) !important;
            opacity: 0;
            pointer-events: none;
        }

        /* القلب المكتمل الذي يظهر بوهج وجمال في المنتصف */
        .final-heart-core {
            position: absolute;
            width: 110px;
            height: 110px;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transform: scale(0.2);
            transition: 1.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 4;
        }

        .final-heart-core svg {
            width: 100%;
            height: 100%;
            fill: var(--gold);
            filter: drop-shadow(0 0 30px var(--gold-glow));
            animation: gentlePulse 3s infinite ease-in-out;
        }

        @keyframes gentlePulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); filter: drop-shadow(0 0 45px var(--gold-glow)); }
        }

        .heart-puzzle-stage.completed .final-heart-core {
            opacity: 1;
            transform: scale(1);
        }

        /* صندوق الرسالة البليغة النهائية */
        .final-message-container {
            position: absolute;
            bottom: 12vh;
            width: 88%;
            max-width: 370px;
            background: rgba(10, 9, 15, 0.9);
            border: 1px solid rgba(244, 208, 111, 0.3);
            backdrop-filter: blur(16px);
            padding: 30px 24px;
            border-radius: 16px;
            text-align: right;
            line-height: 2.3;
            font-size: 15px;
            color: #ede9f5;
            box-shadow: 0 15px 50px rgba(0,0,0,0.8);
            opacity: 0;
            transform: translateY(30px) scale(0.95);
            pointer-events: none;
            transition: 1.4s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 10;
        }

        .final-message-container.show {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
        }

        .final-message-container strong {
            color: var(--gold);
            font-weight: 500;
        }

        .message-signature {
            margin-top: 18px;
            font-size: 13px;
            color: var(--accent);
            letter-spacing: 1px;
            text-align: left;
            font-weight: 400;
        }
    </style>
</head>
<body>

    <!-- خلفية الجزيئات -->
    <div class="ambient-dust"></div>

    <!-- اللوحات والأسماء الخلفية الهادئة (بلا إزعاج بصري) -->
    <div class="ambient-watermarks">
        <span class="watermark-text wm-1">سوسو</span>
        <span class="watermark-text wm-2">مياسم</span>
        <span class="watermark-text wm-3">قلب بابا</span>
    </div>

    <div class="workspace">
        
        <!-- التوجيه النصي -->
        <div class="instruction-banner" id="instructionBanner">امسح الشتات... وجمع أجزاء القلب المبعثرة</div>

        <!-- مسرح تجميع القلب -->
        <div class="heart-puzzle-stage" id="puzzleStage">
            <div class="target-guide-ring"></div>

            <!-- أجزاء القلب المبعثرة الأربعة -->
            <div class="puzzle-shard" id="shard-1" onclick="collectPiece(1)">
                <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
            </div>
            <div class="puzzle-shard" id="shard-2" onclick="collectPiece(2)">
                <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
            </div>
            <div class="puzzle-shard" id="shard-3" onclick="collectPiece(3)">
                <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
            </div>
            <div class="puzzle-shard" id="shard-4" onclick="collectPiece(4)">
                <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
            </div>

            <!-- القلب الكامل في المنتصف -->
            <div class="final-heart-core">
                <svg viewBox="0 0 24 24">
                    <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                </svg>
            </div>
        </div>

        <!-- الرسالة البليغة النهائية -->
        <div class="final-message-container" id="finalMessage">
            مثل نور دافئ يتدفق إلى غرفة مظلمة فيرتب أركانها الساكنة... هكذا كان <strong>دخولكِ إلى حياتي</strong>؛ ترميم ناعم لكل شتات، وإصلاح كامل لهذا القلب ليضيء أبدًا بلا مسافات.
            <div class="message-signature">إلى مياسم (سوسو)</div>
        </div>

    </div>

    <script>
        let collectedPieces = 0;
        const totalPieces = 4;
        const piecesState = { 1: false, 2: false, 3: false, 4: false };

        function collectPiece(id) {
            if (piecesState[id]) return;

            piecesState[id] = true;
            collectedPieces++;

            const shardElement = document.getElementById(`shard-${id}`);
            shardElement.classList.add('collected');

            if (collectedPieces === totalPieces) {
                // إخفاء التوجيه النصي وإظهار الإنجاز والرسالة
                document.getElementById('instructionBanner').style.opacity = '0';
                
                setTimeout(() => {
                    document.getElementById('puzzleStage').classList.add('completed');
                }, 400);

                setTimeout(() => {
                    document.getElementById('finalMessage').classList.add('show');
                }, 1200);
            } else {
                const remaining = totalPieces - collectedPieces;
                document.getElementById('instructionBanner').innerText = `بقي ${remaining} أجزاء لاكتمال الترميم...`;
            }
        }
    </script>
</body>
</html>
