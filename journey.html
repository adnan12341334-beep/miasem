<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أثر - Journey of Echoes</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #030305;
            --card-bg: rgba(255, 255, 255, 0.02);
            --border-glow: rgba(255, 255, 255, 0.08);
            --accent-pink: #ff758c;
            --accent-purple: #7f7fd5;
            --accent-gold: #f6d365;
            --text-main: #f0eff5;
            --text-muted: #8e8b9f;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg-deep);
            font-family: 'Tajawal', sans-serif;
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* شاشة القفل */
        #lock-screen {
            position: fixed;
            inset: 0;
            background: var(--bg-deep);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 1.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .lock-container {
            text-align: center;
            padding: 40px;
            width: 100%;
            max-width: 360px;
        }

        .lock-title {
            font-size: 14px;
            letter-spacing: 4px;
            color: var(--text-muted);
            margin-bottom: 30px;
            font-weight: 300;
        }

        .lock-dots {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 40px;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 1px solid var(--text-muted);
            transition: 0.3s;
        }

        .dot.filled {
            background: var(--accent-pink);
            border-color: var(--accent-pink);
            box-shadow: 0 0 15px rgba(255, 117, 140, 0.5);
        }

        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .key {
            background: var(--card-bg);
            border: 1px solid var(--border-glow);
            color: var(--text-main);
            font-size: 20px;
            height: 60px;
            border-radius: 50%;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .key:active {
            background: rgba(255, 255, 255, 0.1);
            transform: scale(0.95);
        }

        /* المحتوى الرئيسي */
        #journey-content {
            display: none;
            width: 100%;
            max-width: 500px;
            min-height: 100vh;
            padding: 40px 20px;
            box-sizing: border-box;
            opacity: 0;
            transition: opacity 1.5s ease;
            position: relative;
        }

        .stage {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 80vh;
            text-align: center;
            animation: fadeInStage 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .stage.active {
            display: flex;
        }

        @keyframes fadeInStage {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* تصميم المرحلة الأولى: نبض الروح (Pulse) */
        .pulse-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,117,140,0.3) 0%, rgba(3,3,5,0) 70%);
            border: 1px solid rgba(255,117,140,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            animation: corePulse 3s infinite ease-in-out;
            box-shadow: 0 0 30px rgba(255,117,140,0.1);
        }

        @keyframes corePulse {
            0% { transform: scale(0.95); box-shadow: 0 0 20px rgba(255,117,140,0.1); }
            50% { transform: scale(1.08); box-shadow: 0 0 45px rgba(255,117,140,0.3); }
            100% { transform: scale(0.95); box-shadow: 0 0 20px rgba(255,117,140,0.1); }
        }

        .symbol-icon {
            font-size: 28px;
            color: var(--accent-pink);
        }

        /* تصميم المرحلة الثانية: المدارات الفضائية (Orbit) */
        .orbit-container {
            position: relative;
            width: 220px;
            height: 220px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .orbit-ring {
            position: absolute;
            inset: 0;
            border: 1px dashed rgba(127, 127, 213, 0.3);
            border-radius: 50%;
            animation: rotateOrbit 20s linear infinite;
        }

        @keyframes rotateOrbit {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .orbit-center {
            width: 60px;
            height: 60px;
            background: var(--accent-purple);
            border-radius: 50%;
            box-shadow: 0 0 25px rgba(127, 127, 213, 0.6);
            cursor: pointer;
        }

        .orbit-satellite {
            position: absolute;
            width: 24px;
            height: 24px;
            background: #fff;
            border-radius: 50%;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            box-shadow: 0 0 15px #fff;
        }

        /* تصميم المرحلة الثالثة: بوابات النور (Lumina Gates) */
        .gates-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            width: 100%;
            max-width: 300px;
        }

        .gate-card {
            background: var(--card-bg);
            border: 1px solid var(--border-glow);
            height: 90px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.4s;
            font-size: 22px;
        }

        .gate-card.unlocked {
            border-color: var(--accent-gold);
            background: rgba(246, 211, 101, 0.05);
            box-shadow: 0 0 20px rgba(246, 211, 101, 0.15);
        }

        /* تصميم المرحلة الرابعة: خط الزمن المتصل (Constellation Line) */
        .constellation-box {
            width: 100%;
            max-width: 320px;
            height: 180px;
            border: 1px solid var(--border-glow);
            border-radius: 20px;
            background: var(--card-bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        .constellation-line {
            width: 0%;
            height: 2px;
            background: linear-gradient(90deg, var(--accent-pink), var(--accent-gold));
            position: absolute;
            bottom: 40px;
            left: 10%;
            transition: width 1.5s ease;
        }

        .constellation-box.active .constellation-line {
            width: 80%;
        }

        /* تصميم المرحلة الخامسة: الخاتمة الكونية (The Core Singularity) */
        .singularity-core {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: radial-gradient(circle, #fff 0%, var(--accent-pink) 50%, transparent 80%);
            box-shadow: 0 0 60px rgba(255, 117, 140, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            animation: singularityPulse 4s infinite alternate;
        }

        @keyframes singularityPulse {
            0% { transform: scale(0.95); filter: brightness(1); }
            100% { transform: scale(1.05); filter: brightness(1.2); }
        }

        /* عناصر مساعدة */
        .hint-text {
            margin-top: 30px;
            font-size: 13px;
            color: var(--text-muted);
            letter-spacing: 1px;
            font-weight: 300;
        }

        .progress-bar {
            position: fixed;
            top: 0;
            left: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--accent-pink), var(--accent-purple), var(--accent-gold));
            width: 0%;
            transition: width 0.6s ease;
        }
    </style>
</head>
<body>

    <!-- شاشة الرمز السري (20243112) -->
    <div id="lock-screen">
        <div class="lock-container">
            <div class="lock-title">أدخل مفتاح العبور</div>
            <div class="lock-dots" id="lockDots">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
            <div class="keypad">
                <button class="key" onclick="pressKey('1')">1</button>
                <button class="key" onclick="pressKey('2')">2</button>
                <button class="key" onclick="pressKey('3')">3</button>
                <button class="key" onclick="pressKey('4')">4</button>
                <button class="key" onclick="pressKey('5')">5</button>
                <button class="key" onclick="pressKey('6')">6</button>
                <button class="key" onclick="pressKey('7')">7</button>
                <button class="key" onclick="pressKey('8')">8</button>
                <button class="key" onclick="pressKey('9')">9</button>
                <button class="key" style="grid-column: 2;" onclick="pressKey('0')">0</button>
            </div>
        </div>
    </div>

    <!-- شريط التقدم العلوي -->
    <div class="progress-bar" id="progressBar"></div>

    <!-- المحتوى التفاعلي المتنوع -->
    <div id="journey-content">

        <!-- المرحلة الأولى: نبض الروح -->
        <div class="stage active" id="stage-1">
            <div class="pulse-circle" onclick="nextStage(1)">
                <div class="symbol-icon">✦</div>
            </div>
            <div class="hint-text">اضغط للإيقاظ</div>
        </div>

        <!-- المرحلة الثانية: المدار الفضائي -->
        <div class="stage" id="stage-2">
            <div class="orbit-container">
                <div class="orbit-ring"></div>
                <div class="orbit-satellite"></div>
                <div class="orbit-center" onclick="nextStage(2)"></div>
            </div>
            <div class="hint-text">المس نقطة الالتقاء</div>
        </div>

        <!-- المرحلة الثالثة: بوابات النور الأربع -->
        <div class="stage" id="stage-3">
            <div class="gates-grid">
                <div class="gate-card" onclick="unlockGate(this, 1)">✧</div>
                <div class="gate-card" onclick="unlockGate(this, 2)">✧</div>
                <div class="gate-card" onclick="unlockGate(this, 3)">✧</div>
                <div class="gate-card" onclick="unlockGate(this, 4)">✧</div>
            </div>
            <div class="hint-text" id="gatesHint">افتح النوافذ الأربع للعبور</div>
        </div>

        <!-- المرحلة الرابعة: خط التوافق -->
        <div class="stage" id="stage-4">
            <div class="constellation-box" id="constBox" onclick="triggerConstellation()">
                <div style="font-size: 24px; color: var(--accent-gold); margin-bottom: 20px;">✧ ── ✧</div>
                <div class="constellation-line"></div>
            </div>
            <div class="hint-text">اسحب أو انقر لمد الأثر</div>
        </div>

        <!-- المرحلة الخامسة: التفرد الأبدي (الخاتمة) -->
        <div class="stage" id="stage-5">
            <div class="singularity-core" onclick="finalResonance()"></div>
            <div class="hint-text" style="color: var(--accent-pink);">النبض الأخير</div>
        </div>

    </div>

    <script>
        const targetCode = "20243112";
        let enteredCode = "";

        function pressKey(num) {
            if (enteredCode.length < 8) {
                enteredCode += num;
                updateDots();
            }
            if (enteredCode.length === 8) {
                if (enteredCode === targetCode) {
                    unlockVault();
                } else {
                    setTimeout(() => {
                        enteredCode = "";
                        updateDots();
                    }, 400);
                }
            }
        }

        function updateDots() {
            const dots = document.querySelectorAll('.dot');
            dots.forEach((dot, index) => {
                if (index < enteredCode.length) {
                    dot.classList.add('filled');
                } else {
                    dot.classList.remove('filled');
                }
            });
        }

        function unlockVault() {
            const lockScreen = document.getElementById('lock-screen');
            const journey = document.getElementById('journey-content');
            lockScreen.style.opacity = '0';
            setTimeout(() => {
                lockScreen.style.display = 'none';
                journey.style.display = 'block';
                setTimeout(() => { journey.style.opacity = '1'; }, 50);
            }, 1200);
        }

        function updateProgress(stageNum) {
            const progress = (stageNum / 5) * 100;
            document.getElementById('progressBar').style.width = progress + '%';
        }

        function nextStage(current) {
            updateProgress(current);
            document.getElementById(`stage-${current}`).classList.remove('active');
            const next = current + 1;
            if(document.getElementById(`stage-${next}`)) {
                document.getElementById(`stage-${next}`).classList.add('active');
            }
        }

        let unlockedGatesCount = 0;
        function unlockGate(element, id) {
            if (!element.classList.contains('unlocked')) {
                element.classList.add('unlocked');
                element.innerHTML = '✦';
                unlockedGatesCount++;
                if (unlockedGatesCount === 4) {
                    setTimeout(() => {
                        nextStage(3);
                    }, 800);
                }
            }
        }

        let constellationDone = false;
        function triggerConstellation() {
            const box = document.getElementById('constBox');
            if (!constellationDone) {
                constellationDone = true;
                box.classList.add('active');
                setTimeout(() => {
                    nextStage(4);
                }, 1800);
            }
        }

        function finalResonance() {
            document.body.style.transition = "background-color 2s ease";
            document.body.style.backgroundColor = "#120a1a";
            const core = document.querySelector('.singularity-core');
            core.style.transform = "scale(2.5)";
            core.style.opacity = "0";
            setTimeout(() => {
                document.querySelector('#stage-5').innerHTML = `
                    <div style="font-size: 32px; color: #ff758c; font-weight: 300; letter-spacing: 2px;">✦</div>
                `;
            }, 1000);
        }
    </script>
</body>
</html>
