<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>انسجام الأثر - مياسم</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@200;300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #010104;
            --text-main: #f0edf6;
            --accent: #c93b5d;
            --gold: #e5b853;
            --muted-tile: #1a1624;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            font-family: 'Tajawal', sans-serif;
            color: var(--text-main);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* الخلفية الهادئة */
        .ambient-watermarks {
            position: absolute;
            inset: 0;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 0;
            overflow: hidden;
        }

        .watermark-text {
            position: absolute;
            font-weight: 200;
            color: rgba(255, 255, 255, 0.015);
            filter: blur(18px);
            letter-spacing: 8px;
        }

        .wm-1 { top: 12%; right: 10%; font-size: 7rem; transform: rotate(-5deg); }
        .wm-2 { bottom: 10%; left: 8%; font-size: 8rem; transform: rotate(8deg); }
        .wm-3 { top: 48%; left: 15%; font-size: 5rem; transform: rotate(-3deg); }

        .workspace {
            position: relative;
            width: 100%;
            max-width: 480px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2;
            padding: 20px;
        }

        /* مسرح القلب الكبير والمعكوس الحقيقي */
        .sanctuary-board {
            position: relative;
            width: 340px;
            height: 340px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .structural-heart {
            position: relative;
            width: 250px;
            height: 250px;
            /* عكس الشكل أفقياً ورأسياً للطابع الفني */
            transform: scaleX(-1) rotate(180deg);
        }

        .structural-heart svg {
            width: 100%;
            height: 100%;
            fill: none;
            stroke: rgba(201, 59, 93, 0.25);
            stroke-width: 1.2;
            transition: 1.6s ease;
        }

        /* شبكة المكعبات المتفاعلة داخل مساحة القلب (مثل لعبة توحيد الألوان) */
        .puzzle-grid {
            position: absolute;
            inset: 35px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 8px;
            padding: 15px;
            z-index: 4;
        }

        .puzzle-tile {
            background-color: var(--muted-tile);
            border: 1px solid rgba(201, 59, 93, 0.25);
            border-radius: 4px;
            cursor: pointer;
            transition: 0.4s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .puzzle-tile:hover {
            border-color: var(--accent);
            transform: scale(1.05);
        }

        /* حالات المكعبات حسب الألوان المتبعثرة */
        .puzzle-tile.state-0 { background-color: #161221; border-color: rgba(201, 59, 93, 0.2); }
        .puzzle-tile.state-1 { background-color: #3b1828; border-color: var(--accent); }
        .puzzle-tile.state-2 { background-color: #611e3b; border-color: #e0486d; }
        
        /* الحالة المكتملة (توحيد لون جميع المكعبات للذهب الهادئ المتناسق) */
        .sanctuary-board.harmonized .puzzle-tile {
            background-color: rgba(229, 184, 83, 0.18);
            border-color: var(--gold);
            box-shadow: 0 0 15px rgba(229, 184, 83, 0.3);
            pointer-events: none;
        }

        .sanctuary-board.harmonized .structural-heart svg {
            stroke: var(--gold);
            stroke-width: 1.5;
            fill: rgba(229, 184, 83, 0.05);
            filter: drop-shadow(0 0 40px rgba(229, 184, 83, 0.25));
        }

        /* تعليمات إرشادية هادئة للمستخدم */
        .instruction-hint {
            position: absolute;
            top: 15vh;
            font-size: 13px;
            color: rgba(240, 237, 246, 0.4);
            letter-spacing: 1.5px;
            font-weight: 300;
            transition: opacity 0.6s ease;
        }

        .sanctuary-board.harmonized ~ .instruction-hint {
            opacity: 0;
        }

        /* الرسالة الأكثر عمقاً وتأثيراً */
        .profound-message-box {
            position: absolute;
            bottom: 6vh;
            width: 92%;
            max-width: 400px;
            background: rgba(6, 5, 10, 0.97);
            border: 1px solid rgba(229, 184, 83, 0.3);
            backdrop-filter: blur(20px);
            padding: 32px 26px;
            border-radius: 12px;
            text-align: right;
            line-height: 2.7;
            font-size: 15px;
            font-weight: 300;
            color: #eae6f2;
            box-shadow: 0 25px 70px rgba(0,0,0,0.95);
            opacity: 0;
            transform: translateY(35px) scale(0.96);
            pointer-events: none;
            transition: 1.6s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 10;
        }

        .profound-message-box.reveal {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
        }

        .profound-message-box strong {
            color: var(--gold);
            font-weight: 400;
        }

        .message-attribution {
            margin-top: 20px;
            font-size: 13px;
            color: var(--accent);
            letter-spacing: 2px;
            text-align: left;
            font-weight: 300;
        }
    </style>
</head>
<body>

    <!-- الخلفية الصامتة -->
    <div class="ambient-watermarks">
        <span class="watermark-text wm-1">سوسو</span>
        <span class="watermark-text wm-2">مياسم</span>
        <span class="watermark-text wm-3">قلب بابا</span>
    </div>

    <div class="workspace">
        
        <div class="instruction-hint">اضغط لتوحيد وتنسيق تفاصيل القلب</div>

        <!-- مسرح اللعبة الهندسي المتكامل -->
        <div class="sanctuary-board" id="sanctuaryBoard">
            
            <div class="structural-heart">
                <!-- منحنى هندسي واقعي لقلب حقيقي -->
                <svg viewBox="0 0 24 24">
                    <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                </svg>
            </div>

            <!-- شبكة مكعبات التنسيق (لعبة توحيد الحالة واللون) -->
            <div class="puzzle-grid" id="puzzleGrid">
                <div class="puzzle-tile state-1" onclick="toggleTile(0)"></div>
                <div class="puzzle-tile state-0" onclick="toggleTile(1)"></div>
                <div class="puzzle-tile state-2" onclick="toggleTile(2)"></div>
                <div class="puzzle-tile state-2" onclick="toggleTile(3)"></div>
                <div class="puzzle-tile state-1" onclick="toggleTile(4)"></div>
                <div class="puzzle-tile state-0" onclick="toggleTile(5)"></div>
                <div class="puzzle-tile state-0" onclick="toggleTile(6)"></div>
                <div class="puzzle-tile state-2" onclick="toggleTile(7)"></div>
                <div class="puzzle-tile state-1" onclick="toggleTile(8)"></div>
            </div>

        </div>

        <!-- الرسالة العميقة والمؤثرة -->
        <div class="profound-message-box" id="profoundMessage">
            حين كانت كل تفاصيل الروح مبعثرة وتأخذ ألواناً مختلفة من الشتات والغياب، جئتِ أنتِ بهدوء حضورك الحقيقي لتعيدي ترتيب كل زاوية وضعها في نصابها الصحيح. بلمستك الواعية، <strong>أنتِ أصلحتِ قلبي</strong> وأعدتِ له النبض والتناغم والصفاء التام.
            <div class="message-attribution">إلى مياسم (سوسو)</div>
        </div>

    </div>

    <script>
        // مصفوفة تمثل الحالات والألوان المختلفة للمكعبات (0 إلى 2)
        let tileStates = [1, 0, 2, 2, 1, 0, 0, 2, 1];
        let isHarmonized = false;

        function toggleTile(index) {
            if (isHarmonized) return;

            // تغيير حالة المكعب عند الضغط عليه والمكعبات المحيطة به (تأثير شبكي متصل)
            let affected = [index];
            if (index % 3 !== 0) affected.push(index - 1); // اليسار
            if (index % 3 !== 2) affected.push(index + 1); // اليمين
            if (index >= 3) affected.push(index - 3);      // الأعلى
            if (index < 6) affected.push(index + 3);      // الأسفل

            affected.forEach(i => {
                tileStates[i] = (tileStates[i] + 1) % 3;
            });

            renderGrid();
            checkHarmonization();
        }

        function renderGrid() {
            const grid = document.getElementById('puzzleGrid');
            const tiles = grid.children;
            for (let i = 0; i < tiles.length; i++) {
                tiles[i].className = `puzzle-tile state-${tileStates[i]}`;
            }
        }

        function checkHarmonization() {
            // التحقق مما إذا أصبحت كل المكعبات تحمل نفس القيمة والحالة المتطابقة تماماً
            const firstState = tileStates[0];
            const allSame = tileStates.every(state => state === firstState);

            if (allSame) {
                isHarmonized = true;
                setTimeout(() => {
                    document.getElementById('sanctuaryBoard').classList.add('harmonized');
                }, 400);

                setTimeout(() => {
                    document.getElementById('profoundMessage').classList.add('reveal');
                }, 1300);
            }
        }
    </script>
</body>
</html>
