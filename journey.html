<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #08070b;
            font-family: 'Tajawal', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            direction: rtl;
        }
        .card {
            width: 380px;
            padding: 50px 35px;
            background: linear-gradient(145deg, #13101a, #0b0910);
            border: 1px solid rgba(255, 182, 193, 0.2);
            border-radius: 24px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8);
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, transparent, #ffb6c1, transparent);
        }
        .icon {
            font-size: 24px;
            color: #ffb6c1;
            margin-bottom: 25px;
        }
        .title {
            color: #ffb6c1;
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }
        .message {
            color: #d8d0e3;
            font-size: 15px;
            line-height: 2.2;
            margin-bottom: 30px;
            font-weight: 400;
            text-align: center;
        }
        .signature {
            color: #9c8da6;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 1.5px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 20px;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="icon">✨</div>
        <div class="title">إلى مياسم</div>
        <div class="message">
            "بين ضجيج المسافات وشاشات الانتظار.. يبقى صوتك هو الملاذ، وقريباً تنكسر كل الحدود لنلتقي."
        </div>
        <div class="signature">سوسو القلب 🤍</div>
    </div>

</body>
</html>
