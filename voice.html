            display: flex;

        .container {

        /* قسم العد التنازلي */
        .countdown-section {

        .countdown-title {
            color: #ffb6c1;

            font-weight: bold;
        }

        #timer {

            color: #fff;

        }

        .input-group {
            margin-bottom: 20px;
        }

        input[type="password"] {
            width: 80%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #d47a96;
            background-color: #1a1518;
            color: #fff;
            text-align: center;
            font-size: 16px;
            outline: none;
        }

        input[type="password"]::placeholder {
            color: #888;
        }

        button {
            background-color: #d47a96;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background-color: #b55d78;
        }

        .hidden-content {
            display: none;
            margin-top: 20px;
            animation: fadeIn 1s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
