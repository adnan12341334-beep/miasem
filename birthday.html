### 1. أين تضع كود العداد (JavaScript + HTML)?
تقدر تحط هذا الكود في المكان اللي تبي يظهر فيه العداد داخل ملف `birthday.html` (مثلاً بعد خانة إدخال الرمز السري أو في قسم الترحيب):

```html
<!-- عنصر العداد التنازلي -->
<div id="countdown-container" style="text-align: center; margin: 20px 0; font-family: inherit;">
    <p style="color: #666; font-size: 14px; margin-bottom: 8px;">الوقت المتبقي لليوم المنتظر:</p>
    <div id="countdown-timer" style="display: flex; justify-content: center; gap: 15px; font-weight: bold; color: #d4a373;">
        <div><span id="days">00</span><div style="font-size: 10px; color: #888;">يوم</div></div>
        <div>:</div>
        <div><span id="hours">00</span><div style="font-size: 10px; color: #888;">ساعة</div></div>
        <div>:</div>
        <div><span id="minutes">00</span><div style="font-size: 10px; color: #888;">دقيقة</div></div>
        <div>:</div>
        <div><span id="seconds">00</span><div style="font-size: 10px; color: #888;">ثانية</div></div>
    </div>
</div>

<script>
    // حدد التاريخ المستهدف هنا (مثلاً تاريخ ميلادها القادم أو المناسبة القادمة)
    // الصيغة: السنة، الشهر (الشهر يبدأ من 0، يعني نوفمبر هو 10)، اليوم، الوقت
    const targetDate = new Date("November 30, 2026 00:00:00").getTime();

    const timerInterval = setInterval(function() {
        const now = new Date().getTime();
        const distance = targetDate - now;

        if (distance < 0) {
            clearInterval(timerInterval);
            document.getElementById("countdown-timer").innerHTML = "<span style='color: #e07a5f;'>لقد وصل اليوم المميّز! 🎉</span>";
            return;
        }

        const days = Math.floor(distance / (1000 * 60 * 60 * 24));
        const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((distance % (1000 * 60 * 60)) / 1000);

        document.getElementById("days").innerText = String(days).padStart(2, '0');
        document.getElementById("hours").innerText = String(hours).padStart(2, '0');
        document.getElementById("minutes").innerText = String(minutes).padStart(2, '0');
        document.getElementById("seconds").innerText = String(seconds).padStart(2, '0');
    }, 1000);
</script>
